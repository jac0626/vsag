global:
    num_threads_building: 16
    num_threads_searching: 16
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/eval_example_output.json"
      send-to-influxdb:
        format: "line_protocol"
        to: "influxdb://127.0.0.1:8086/api/v2/write?org=<org>&bucket=<bucket>&precision=ns"
        vars:
          token: "Token <influxdb-token>"

eval_case1:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "build,search" # YAML supports build, search, or build,search
    index_name: "hgraph"
    create_params: >-
        {"dim":128,"dtype":"float32","metric_type":"l2",
        "index_param":{"base_quantization_type":"fp32","max_degree":32,
        "ef_construction":300}}
    search_params: '{"hgraph":{"ef_search":60}}'
    index_path: "/tmp/sift-128-euclidean/index/hgraph_index"
    search_mode: "knn" # knn or knn_filter
    topk: 10
    range: 0.5
    search_query_count: 100000
    delete_index_after_search: false
